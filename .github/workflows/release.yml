name: Release Binaries

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build-and-release:
    name: Build & Upload Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Build Binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release_assets
          LDFLAGS="-s -w -X main.version=${VERSION}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o release_assets/gcp-arch-linux-amd64 ./cmd/gcp-arch
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o release_assets/gcp-arch-linux-arm64 ./cmd/gcp-arch
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o release_assets/gcp-arch-darwin-amd64 ./cmd/gcp-arch
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o release_assets/gcp-arch-darwin-arm64 ./cmd/gcp-arch
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o release_assets/gcp-arch-windows-amd64.exe ./cmd/gcp-arch

      - name: Upload Release Assets
        # zizmor: ignore[superfluous-actions] -- declarative release creation and asset upload on tag push
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

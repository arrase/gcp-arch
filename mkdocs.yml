site_name: GCP Arch
site_description: Semantic multi-view Google Cloud Platform architecture pipeline — read-only discovery, Gemini 4 synthesis on Vertex AI, and offline vector PDF, 3x PNG, and HTML dossiers.
site_author: Arrase
site_url: https://arrase.github.io/gcp-arch/
docs_dir: gh-pages

repo_name: arrase/gcp-arch
repo_url: https://github.com/arrase/gcp-arch

nav:
  - Overview: index.md
  - Getting Started:
      - CLI & Configuration: cli_configuration.md
      - Security, IAM & Preflight: security_iam.md
  - Three-Stage Pipeline:
      - Stage 1 — Read-Only Extraction: extraction.md
      - Stage 2 — Gemini 4 Synthesis & Day-2: synthesis.md
      - Stage 3 — Offline Rendering & Routing: rendering.md
  - Manifest & Examples:
      - Manifest Schema & Validation: manifest_schema.md
      - Examples & Visual Gallery: examples.md
  - Reference & Engineering:
      - System Architecture: architecture.md
      - Developer Guide: developer_guide.md

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/code-tags
  palette:
    # Palette toggle for light/dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy

plugins:
  - search

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/ecosystem.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arrase/gcp-arch
